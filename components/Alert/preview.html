<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bundle.css">
<style>body{margin:0;padding:24px;background:var(--surface)}.stack{display:flex;flex-direction:column;gap:8px;max-width:520px}.demo{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}</style></head><body class="gr">
<div class="stack">
<div class="gr-alert gr-alert--info" role="status"><span class="gr-alert__dot"></span><span><strong>Info:</strong> a new version is available.</span></div>
<div class="gr-alert gr-alert--success" role="status"><span class="gr-alert__dot"></span><span><strong>Success:</strong> your changes are saved.</span></div>
<div class="gr-alert gr-alert--warning" role="status"><span class="gr-alert__dot"></span><span><strong>Warning:</strong> storage is almost full.</span></div>
<div class="gr-alert gr-alert--danger" role="alert"><span class="gr-alert__dot"></span><span><strong>Error:</strong> the payment did not go through.</span></div>
</div>
<div class="demo">
<span class="gr-badge gr-badge--info">Info</span><span class="gr-badge gr-badge--success">Paid</span><span class="gr-badge gr-badge--warning">Pending</span><span class="gr-badge gr-badge--danger">Failed</span>
<span class="gr-tag gr-tag--info">Info</span><span class="gr-tag gr-tag--success">Paid</span><span class="gr-tag gr-tag--warning">Pending</span><span class="gr-tag gr-tag--danger">Failed</span>
</div>
</body></html>
