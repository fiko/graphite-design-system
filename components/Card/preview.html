<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="../bundle.css">
<style>body{margin:0;padding:24px;background:var(--canvas)}.demo{display:flex;flex-wrap:wrap;align-items:center;gap:12px}</style></head><body class="gr">
<div class="demo" style="align-items:flex-start;gap:16px">
<section class="gr-card" style="width:280px">
<div class="gr-card__head">Upcoming events<button class="gr-btn gr-btn--secondary gr-btn--icon gr-btn--sm" aria-label="Add event"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg></button></div>
<div class="gr-card gr-card--inner"><span class="gr-tag gr-tag--pill" style="background:var(--surface)">10 May</span><div class="gr-card__value">10:30</div><div class="gr-card__text">Brainstorm and how to use it</div></div>
<div class="gr-card gr-card--inner"><span class="gr-tag gr-tag--pill" style="background:var(--surface)">11 May</span><div class="gr-card__value">12:00</div><div class="gr-card__text">Team standup and project discussion</div></div>
<div class="gr-card__foot">View all 24 events</div>
</section>
<section class="gr-card" style="width:240px;background:transparent;box-shadow:none;padding:0">
<div class="gr-card__head" style="margin-bottom:4px">Storage almost full</div>
<div class="gr-card__text" style="margin-bottom:12px">See our upgraded storage plans.</div>
<div style="display:flex;justify-content:space-between;font:500 11px/14px var(--font-sans);margin-bottom:6px"><span>16.7 GB</span><span>20 GB</span></div>
<div class="gr-progress" role="progressbar" aria-valuenow="83" aria-valuemin="0" aria-valuemax="100" aria-label="Storage used"><i style="width:83%"></i></div>
<button class="gr-btn gr-btn--primary gr-btn--block" style="margin-top:16px">Upgrade plan</button>
</section>
</div>
</body></html>
